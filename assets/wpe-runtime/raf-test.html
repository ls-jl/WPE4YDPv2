<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:white;font:24px sans-serif}.box{position:absolute;width:120px;height:80px;background:#00c2ff;top:70px;left:0}.bar{position:absolute;bottom:0;left:0;height:22px;background:#ffe45c;width:0}.txt{position:absolute;top:8px;left:10px}</style><div class="txt" id="txt">raf 0</div><div class="box" id="box"></div><div class="bar" id="bar"></div><script>let f=0,t0=performance.now(),last=t0;function step(t){f++;let x=(f*9)%840;box.style.transform=`translateX(${x}px)`;bar.style.width=((f%120)/120*100)+"%";if(t-last>500){txt.textContent="raf "+f+" "+Math.round(1000*(f/(t-t0)))+"fps";last=t;}requestAnimationFrame(step)}requestAnimationFrame(step);</script>
