<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WPE Scroll Benchmark</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #eef2f7; color: #18202a; font: 15px sans-serif; }
    header { position: sticky; top: 0; z-index: 2; height: 38px; padding: 9px 14px; background: #1677ff; color: white; }
    main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 8px; }
    article { min-height: 92px; padding: 9px; border: 1px solid #bcc8d8; background: white; box-shadow: 0 2px 5px #0002; }
    article:nth-child(3n + 1) { border-top: 4px solid #1677ff; }
    article:nth-child(3n + 2) { border-top: 4px solid #18a058; }
    article:nth-child(3n) { border-top: 4px solid #f0a020; }
    h2 { margin: 0 0 6px; font-size: 16px; }
    p { margin: 0; line-height: 1.35; }
    canvas { display: block; width: 100%; height: 32px; margin-top: 7px; background: #e8edf4; }
  </style>
</head>
<body>
  <header id="status">Starting...</header>
  <main id="content"></main>
  <script>
    const content = document.getElementById('content');
    const status = document.getElementById('status');
    const fragment = document.createDocumentFragment();

    for (let i = 0; i < 180; i += 1) {
      const card = document.createElement('article');
      card.innerHTML = `<h2>Card ${i + 1}</h2><p>Raster scrolling workload with text, borders, shadows, and a small animated canvas.</p>`;
      if (!(i % 9)) {
        const canvas = document.createElement('canvas');
        canvas.width = 240;
        canvas.height = 32;
        card.appendChild(canvas);
      }
      fragment.appendChild(card);
    }
    content.appendChild(fragment);

    const canvases = Array.from(document.querySelectorAll('canvas'));
    let direction = 1;
    let frames = 0;
    let windowStart = performance.now();

    function drawCanvases(now) {
      for (let index = 0; index < canvases.length; index += 1) {
        const canvas = canvases[index];
        const context = canvas.getContext('2d');
        const x = (now / 8 + index * 17) % canvas.width;
        context.clearRect(0, 0, canvas.width, canvas.height);
        context.fillStyle = index % 2 ? '#18a058' : '#1677ff';
        context.fillRect(x, 4, 28, 24);
      }
    }

    function tick(now) {
      const maxScroll = document.documentElement.scrollHeight - innerHeight;
      scrollBy(0, direction * 3);
      if (scrollY >= maxScroll - 2)
        direction = -1;
      else if (scrollY <= 2)
        direction = 1;

      drawCanvases(now);
      frames += 1;
      const elapsed = now - windowStart;
      if (elapsed >= 2000) {
        status.textContent = `WPE scroll benchmark: ${(frames * 1000 / elapsed).toFixed(1)} fps`;
        frames = 0;
        windowStart = now;
      }
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
