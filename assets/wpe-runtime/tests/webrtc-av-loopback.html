<!doctype html>
<meta charset="utf-8">
<title>WebRTC AV Loopback Starting</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #101214; color: #fff; font: 14px sans-serif; }
  main { box-sizing: border-box; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 100%; padding: 8px; }
  canvas, video { width: 100%; min-height: 0; background: #000; object-fit: contain; }
  pre { grid-column: 1 / -1; height: 54px; margin: 0; color: #55b9ff; white-space: pre-wrap; }
</style>
<main>
  <canvas id="source" width="320" height="180"></canvas>
  <video id="remote" autoplay muted playsinline></video>
  <pre id="status">starting</pre>
</main>
<script>
  const canvas = document.querySelector('#source');
  const context = canvas.getContext('2d');
  const remote = document.querySelector('#remote');
  const status = document.querySelector('#status');
  const sender = new RTCPeerConnection();
  const receiver = new RTCPeerConnection();
  let frame = 0;
  let videoPackets = 0;
  let audioPackets = 0;
  let decodedFrames = 0;

  function log(message) {
    console.log(`WEBRTC_AV_TEST ${message}`);
    status.textContent = message;
  }

  function fail(error) {
    const message = error && (error.stack || error.message) || String(error);
    document.title = 'FAIL WebRTC AV Loopback';
    log(`FAIL ${message}`);
  }

  function draw() {
    const x = frame++ % canvas.width;
    context.fillStyle = '#071018';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.fillStyle = '#168cff';
    context.fillRect(x, 0, 24, canvas.height);
    context.fillStyle = '#fff';
    context.font = '24px sans-serif';
    context.fillText(`frame ${frame}`, 12, 34);
    requestAnimationFrame(draw);
  }

  function preferVP8(transceiver) {
    const capabilities = RTCRtpReceiver.getCapabilities('video');
    if (!transceiver.setCodecPreferences || !capabilities)
      return;
    const codecs = capabilities.codecs.filter(codec => /video\/(vp8|rtx)/i.test(codec.mimeType));
    if (codecs.some(codec => /video\/vp8/i.test(codec.mimeType)))
      transceiver.setCodecPreferences(codecs);
  }

  sender.onicecandidate = event => {
    if (event.candidate)
      receiver.addIceCandidate(event.candidate).catch(fail);
  };
  receiver.onicecandidate = event => {
    if (event.candidate)
      sender.addIceCandidate(event.candidate).catch(fail);
  };
  receiver.ontrack = event => {
    if (event.streams[0] && remote.srcObject !== event.streams[0]) {
      remote.srcObject = event.streams[0];
      remote.play().catch(fail);
    }
  };

  async function updateStats() {
    const reports = await receiver.getStats();
    reports.forEach(report => {
      if (report.type !== 'inbound-rtp')
        return;
      if (report.kind === 'video') {
        videoPackets = report.packetsReceived || 0;
        decodedFrames = report.framesDecoded || 0;
      } else if (report.kind === 'audio')
        audioPackets = report.packetsReceived || 0;
    });
    log(`video=${videoPackets}/${decodedFrames} audio=${audioPackets} time=${remote.currentTime.toFixed(2)}`);
    if (videoPackets > 5 && decodedFrames > 2 && audioPackets > 5) {
      document.title = 'PASS WebRTC AV Loopback';
      log(`PASS video=${videoPackets}/${decodedFrames} audio=${audioPackets}`);
    }
  }

  (async () => {
    draw();
    const stream = canvas.captureStream(30);
    const audioContext = new AudioContext();
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const destination = audioContext.createMediaStreamDestination();
    gain.gain.value = 0.01;
    oscillator.connect(gain).connect(destination);
    oscillator.start();
    await audioContext.resume();
    stream.addTrack(destination.stream.getAudioTracks()[0]);

    for (const track of stream.getTracks())
      sender.addTrack(track, stream);
    const videoTransceiver = sender.getTransceivers().find(item => item.sender.track && item.sender.track.kind === 'video');
    if (videoTransceiver)
      preferVP8(videoTransceiver);

    const offer = await sender.createOffer();
    await sender.setLocalDescription(offer);
    await receiver.setRemoteDescription(offer);
    const answer = await receiver.createAnswer();
    await receiver.setLocalDescription(answer);
    await sender.setRemoteDescription(answer);
    setInterval(() => updateStats().catch(fail), 1000);
    setTimeout(() => {
      if (!document.title.startsWith('PASS'))
        fail(new Error(`timeout video=${videoPackets}/${decodedFrames} audio=${audioPackets}`));
    }, 20000);
  })().catch(fail);
</script>
