<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frame integrity</title>
<style>
  body { margin: 0; background: #fff; font: 16px sans-serif; }
  .row { height: 90px; display: flex; align-items: center; padding: 12px; }
  .row:nth-child(even) { background: #b8d4ed; }
  .row:nth-child(odd) { background: #efca65; }
  .moving { width: 60px; height: 30px; background: #008bd2; opacity: .65; }
  .code { position: fixed; left: 0; width: 100%; height: 8px; z-index: 100; }
  #top { top: 8px; } #middle { top: 50%; } #bottom { bottom: 8px; }
</style>
<main id="rows"></main>
<canvas id="top" class="code"></canvas>
<canvas id="middle" class="code"></canvas>
<canvas id="bottom" class="code"></canvas>
<script>
  const codes = ['top', 'middle', 'bottom'].map(id => document.getElementById(id));
  const moving = [];
  for (let i = 0; i < 100; ++i) {
    const row = document.createElement('div');
    row.className = 'row';
    row.textContent = 'Frame integrity row ' + i + ' ';
    const marker = document.createElement('div');
    marker.className = 'moving';
    row.appendChild(marker);
    moving.push(marker);
    rows.appendChild(row);
  }
  function resize() {
    codes.forEach(canvas => { canvas.width = innerWidth; canvas.height = 8; });
  }
  addEventListener('resize', resize);
  resize();
  let sequence = 0;
  let lastTime = 0;
  const freezeAfter = location.pathname.endsWith('-freeze.html') ? 150 : 0;
  function tick(time) {
    sequence = (sequence + 1) & 65535;
    const bits = [1, 0];
    for (let bit = 15; bit >= 0; --bit) bits.push((sequence >> bit) & 1);
    bits.push(0, 1);
    codes.forEach(canvas => {
      const context = canvas.getContext('2d');
      for (let i = 0; i < bits.length; ++i) {
        const x1 = Math.floor(i * canvas.width / bits.length);
        const x2 = Math.floor((i + 1) * canvas.width / bits.length);
        context.fillStyle = bits[i] ? '#ffffff' : '#000000';
        context.fillRect(x1, 0, x2 - x1, 8);
      }
    });
    moving.forEach((node, index) => {
      node.style.transform = 'translateX(' + Math.round(Math.sin(time / 300 + index) * 40) + 'px)';
    });
    if (location.search.includes('auto')) {
      const extent = document.documentElement.scrollHeight - innerHeight;
      scrollTo(0, Math.abs((time * 1.5 % (extent * 2)) - extent));
    }
    if (!(sequence % 30)) document.title = 'Frame ' + sequence + ' gap=' + Math.round(time - lastTime);
    lastTime = time;
    if (!freezeAfter || sequence < freezeAfter)
      requestAnimationFrame(tick);
    else document.title = 'Frozen frame ' + sequence;
  }
  requestAnimationFrame(tick);
</script>
