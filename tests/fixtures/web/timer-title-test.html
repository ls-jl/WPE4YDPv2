<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>boot</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#182010;color:white;font:24px sans-serif}.box{position:absolute;width:120px;height:80px;background:#5dff78;top:70px;left:0}.bar{position:absolute;bottom:0;left:0;height:22px;background:#ff7a59;width:0}.txt{position:absolute;top:8px;left:10px}</style><div class="txt" id="txt">timer 0</div><div class="box" id="box"></div><div class="bar" id="bar"></div><script>let f=0,t0=Date.now(),last=t0;setInterval(()=>{f++;let x=(f*9)%840;box.style.transform=`translateX(${x}px)`;bar.style.width=((f%120)/120*100)+"%";let n=Date.now();if(n-last>500){let msg="timer "+f+" "+Math.round(1000*(f/(n-t0)))+"fps";txt.textContent=msg;document.title=msg;console.log(msg);last=n;}},33);</script>
