<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Touch Pointer Test</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0b1117;
      color: #f7fafc;
      font-family: monospace;
      touch-action: none;
      user-select: none;
    }

    #stage {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #0b1117;
    }

    #hud {
      position: fixed;
      left: 10px;
      top: 8px;
      padding: 7px 9px;
      min-width: 300px;
      background: rgba(8, 13, 19, 0.84);
      border: 1px solid rgba(116, 191, 255, 0.55);
      color: #e8f5ff;
      font: 13px/1.35 monospace;
      pointer-events: none;
    }

    #hint {
      position: fixed;
      right: 10px;
      bottom: 8px;
      padding: 6px 8px;
      background: rgba(8, 13, 19, 0.76);
      border: 1px solid rgba(255, 213, 99, 0.55);
      color: #fff1b8;
      font: 12px/1.3 monospace;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="hud"></div>
  <div id="hint">Tap targets and drag. The red cross must stay under your finger.</div>
  <script>
    (function () {
      "use strict";

      var canvas = document.getElementById("stage");
      var ctx = canvas.getContext("2d", { alpha: false });
      var hud = document.getElementById("hud");
      var points = [];
      var last = null;
      var seq = 0;
      var down = false;

      function resize() {
        var dpr = window.devicePixelRatio || 1;
        var width = Math.max(1, Math.round(window.innerWidth * dpr));
        var height = Math.max(1, Math.round(window.innerHeight * dpr));
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }

      function addPoint(type, x, y) {
        seq += 1;
        last = {
          type: type,
          x: x,
          y: y,
          t: Date.now(),
          seq: seq
        };
        points.push(last);
        if (points.length > 80)
          points.shift();
        draw();
      }

      function eventPoint(event) {
        if (event.touches && event.touches.length)
          return event.touches[0];
        if (event.changedTouches && event.changedTouches.length)
          return event.changedTouches[0];
        return event;
      }

      function onInput(event) {
        event.preventDefault();
        var point = eventPoint(event);
        if (!point)
          return;
        if (event.type === "touchstart" || event.type === "mousedown" || event.type === "pointerdown")
          down = true;
        if (event.type === "touchend" || event.type === "mouseup" || event.type === "pointerup" || event.type === "touchcancel")
          down = false;
        addPoint(event.type, point.clientX, point.clientY);
      }

      function drawTargets(width, height) {
        var targets = [
          [24, 24, "TL"],
          [width - 24, 24, "TR"],
          [24, height - 24, "BL"],
          [width - 24, height - 24, "BR"],
          [width / 2, height / 2, "C"]
        ];

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "12px monospace";
        targets.forEach(function (target) {
          var x = target[0];
          var y = target[1];
          ctx.strokeStyle = "#ffd35c";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(x, y, 18, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x - 24, y);
          ctx.lineTo(x + 24, y);
          ctx.moveTo(x, y - 24);
          ctx.lineTo(x, y + 24);
          ctx.stroke();
          ctx.fillStyle = "#ffd35c";
          ctx.fillText(target[2], x, y);
        });
      }

      function drawGrid(width, height) {
        ctx.fillStyle = "#0b1117";
        ctx.fillRect(0, 0, width, height);

        ctx.strokeStyle = "#1b3345";
        ctx.lineWidth = 1;
        for (var x = 0; x <= width; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x + 0.5, 0);
          ctx.lineTo(x + 0.5, height);
          ctx.stroke();
        }
        for (var y = 0; y <= height; y += 40) {
          ctx.beginPath();
          ctx.moveTo(0, y + 0.5);
          ctx.lineTo(width, y + 0.5);
          ctx.stroke();
        }

        ctx.strokeStyle = "#3b6f92";
        for (var x2 = 0; x2 <= width; x2 += 120) {
          ctx.beginPath();
          ctx.moveTo(x2 + 0.5, 0);
          ctx.lineTo(x2 + 0.5, height);
          ctx.stroke();
        }
        for (var y2 = 0; y2 <= height; y2 += 120) {
          ctx.beginPath();
          ctx.moveTo(0, y2 + 0.5);
          ctx.lineTo(width, y2 + 0.5);
          ctx.stroke();
        }
      }

      function drawPath() {
        if (!points.length)
          return;

        ctx.lineWidth = 2;
        ctx.strokeStyle = "#48e0a4";
        ctx.beginPath();
        for (var i = 0; i < points.length; i += 1) {
          if (i === 0)
            ctx.moveTo(points[i].x, points[i].y);
          else
            ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.stroke();

        points.forEach(function (point, index) {
          var alpha = 0.18 + 0.82 * (index + 1) / points.length;
          ctx.fillStyle = "rgba(72, 224, 164, " + alpha.toFixed(3) + ")";
          ctx.beginPath();
          ctx.arc(point.x, point.y, 3, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function drawCross(point) {
        if (!point)
          return;
        var x = point.x;
        var y = point.y;
        ctx.strokeStyle = "#ff3d3d";
        ctx.fillStyle = "#ff3d3d";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x - 34, y);
        ctx.lineTo(x + 34, y);
        ctx.moveTo(x, y - 34);
        ctx.lineTo(x, y + 34);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = "13px monospace";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText(Math.round(x) + "," + Math.round(y), x + 12, y + 10);
      }

      function draw() {
        var width = window.innerWidth;
        var height = window.innerHeight;
        drawGrid(width, height);
        drawTargets(width, height);
        drawPath();
        drawCross(last);
        hud.textContent = [
          "viewport: " + width + " x " + height + " dpr=" + (window.devicePixelRatio || 1),
          "last: " + (last ? last.type + " #" + last.seq + " x=" + last.x.toFixed(1) + " y=" + last.y.toFixed(1) : "none"),
          "down: " + down + " points=" + points.length,
          "expected panel: 960 x 266"
        ].join("\\n");
      }

      ["touchstart", "touchmove", "touchend", "touchcancel", "mousedown", "mousemove", "mouseup", "click", "pointerdown", "pointermove", "pointerup"].forEach(function (type) {
        window.addEventListener(type, onInput, { passive: false });
      });

      window.addEventListener("resize", resize);
      setInterval(draw, 250);
      resize();
    })();
  </script>
</body>
</html>
