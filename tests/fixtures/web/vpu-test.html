<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;overflow:hidden;font-family:sans-serif}
video{width:100vw;height:100vh;object-fit:contain;background:#000}
#status{position:fixed;left:8px;top:8px;background:rgba(0,0,0,.55);padding:5px 7px;font-size:15px;z-index:2}
</style>
</head>
<body>
<div id="status">loading</div>
<video id="v" src="file:///userdisk/wpe-drm2/vpu-test-h264-long.mp4" autoplay muted playsinline></video>
<script>
const s=document.getElementById("status");
const v=document.getElementById("v");
function log(t){s.textContent=t; console.log("video-test:",t)}
["loadedmetadata","canplay","playing","pause","ended","waiting","stalled","error"].forEach(e=>v.addEventListener(e,()=>log(e+" t="+v.currentTime.toFixed(2)+" ready="+v.readyState)));
v.play().then(()=>log("play-ok")).catch(e=>log("play-failed "+e.name));
setInterval(()=>log("t="+v.currentTime.toFixed(2)+" ready="+v.readyState+" paused="+v.paused),1000);
</script>
</body>
</html>
